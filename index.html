<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyTrack — Öğrenci Ödev ve Sınav Takip Uygulaması</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">ST</span>
        <div>
          <h1 class="brand-title">StudyTrack</h1>
          <p class="brand-subtitle">Öğrenci Ödev, Proje ve Sınav Takip Paneli</p>
        </div>
      </div>
      <div class="header-meta">
        <span id="todayDateLabel" class="date-pill"></span>
      </div>
    </div>
  </header>

  <main class="container app-main">
    <section class="card placeholder-card">
      <h2>Çalışma Alanı Hazır</h2>
      <p>StudyTrack temel proje iskeleti oluşturuldu. Planlanan özellikler iş takip panosundaki görevlere göre geliştirilecektir.</p>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <p>StudyTrack · Güncel Yazılım Geliştirme Süreçleri ve DevOps Bireysel Projesi</p>
    </div>
  </footer>

  <script defer src="js/core.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
